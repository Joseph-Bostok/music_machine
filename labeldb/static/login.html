<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Label Roster</title>
<style>
  :root { --bg: #f7f7f5; --panel: #fff; --text: #1d1d1f; --muted: #6b6b70;
          --border: #e2e2de; --accent: #5b4bdb; --danger: #b3261e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151517; --panel: #1f1f22; --text: #ececef; --muted: #9a9aa2;
            --border: #333338; --accent: #9d92ff; --danger: #f2837a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
         background: var(--bg); color: var(--text); }
  form { width: 100%; max-width: 340px; background: var(--panel); border: 1px solid var(--border);
         border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 12px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
  input { font: inherit; font-size: 15px; color: var(--text); background: var(--bg);
          border: 1px solid var(--border); border-radius: 6px; padding: 9px 10px; }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button { font: inherit; font-weight: 600; padding: 10px; border-radius: 6px; border: 0;
           background: var(--accent); color: #fff; cursor: pointer; margin-top: 4px; }
  button:disabled { opacity: .6; cursor: default; }
  .error { color: var(--danger); min-height: 1.4em; font-size: 13px; }
</style>
</head>
<body>
<form id="form">
  <h1>Label Roster</h1>
  <label>Email<input name="email" type="email" autocomplete="username" required autofocus></label>
  <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
  <button id="submit">Sign in</button>
  <div class="error" id="error" role="alert"></div>
</form>
<script>
document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("submit");
  const err = document.getElementById("error");
  btn.disabled = true; err.textContent = "";
  try {
    const res = await fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(Object.fromEntries(new FormData(e.target))),
    });
    if (res.ok) { location.href = "/"; return; }
    const body = await res.json().catch(() => ({}));
    err.textContent = typeof body.detail === "string" ? body.detail : "Sign-in failed";
  } catch { err.textContent = "Couldn't reach the server"; }
  btn.disabled = false;
});
</script>
</body>
</html>
